name: CrossDesk macOS 12 build

# 单文件自包含：三个补丁以 base64 内联，无需额外上传文件
on:
  workflow_dispatch:

jobs:
  build-x64:
    # macos-13 = Intel 机器，直接产出 x86_64。
    # 若 GitHub 已下线 macos-13：改成 macos-14，并在编译步骤的 xmake f 后加 -a x86_64
    runs-on: macos-13
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.3"
      CROSSDESK_VERSION: "1.7.6"

    steps:
      - name: 检出源码（含 minirtc 子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 还原并应用 macOS 12.3 补丁
        run: |
          set -e
          mkdir -p patches
          echo "" | base64 -d > patches/0001.patch
          echo "" | base64 -d > patches/0002.patch
          echo "" | base64 -d > patches/0003.patch
          git apply patches/0001.patch
          git apply patches/0002.patch
          git apply patches/0003.patch
          echo "补丁已应用"

      - name: 安装 xmake 3.1.2
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2
          actions-cache-folder: .xmake-cache

      - name: 编译
        run: |
          set -e
          xmake f -c -m release --target_minver=12.3 \
            --CROSSDESK_VERSION=${{ env.CROSSDESK_VERSION }} --USE_CUDA=false -y
          xmake b -vy crossdesk

      - name: 校验（minos 必须 12.3，采集补丁必须在二进制里）
        run: |
          set -e
          otool -l build/macosx/x86_64/release/crossdesk \
            | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "minos =", $2; exit}'
          strings build/macosx/x86_64/release/crossdesk | grep -q "macOS capture geometry"
          echo "被控端采集补丁已编入"

      - name: 打包
        run: |
          set -e
          ./apps/desktop/scripts/macos/pkg_x64.sh ${{ env.CROSSDESK_VERSION }}
          ls -lh *.pkg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: crossdesk-macos12-x64
          path: crossdesk-macos-x64-*.pkg
          if-no-files-found: error
